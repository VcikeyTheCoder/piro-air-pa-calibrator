<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PA Load Cell</title>
<style>
/* Tokens. Dark is the default so the page sits naturally next to Mainsail. */
:root{--bg:#101317;--panel:#171b21;--panel2:#1d222a;--rule:#2a303a;--text:#e8ebf0;--dim:#8b94a3;
 --trace:#5ec8ff;--slow:rgba(94,200,255,.10);--fast:rgba(255,180,77,.14);--amber:#ffb44d;--rec:#ff6b5e;--ok:#6fd49a;--grid:#242a33;
 --r:6px;--font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
:root[data-theme=light]{--bg:#f3f4f6;--panel:#fff;--panel2:#f6f7f9;--rule:#d9dde3;--text:#1b2028;--dim:#667085;
 --trace:#0b7fc2;--slow:rgba(11,127,194,.09);--fast:rgba(217,119,6,.13);--amber:#c76a00;--rec:#d63a2c;--ok:#1d8a50;--grid:#e6e9ee}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font)}
body{min-height:100vh}.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--rule);border-radius:var(--r);padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--dim)}button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--trace);border-color:var(--trace);color:#06121a;font-weight:600}
:root[data-theme=light] button.primary{color:#fff}
button.rec{background:var(--rec);border-color:var(--rec);color:#fff;font-weight:600}
button.quiet{background:none;border-color:transparent;color:var(--dim)}button.quiet:hover:not(:disabled){color:var(--text);border-color:var(--rule)}
button.danger{color:var(--rec)}
:focus-visible{outline:2px solid var(--trace);outline-offset:2px}
input,select,textarea{background:var(--bg);border:1px solid var(--rule);border-radius:var(--r);padding:6px 9px;min-width:0}
textarea{width:100%;min-height:56px;resize:vertical}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--rule)}
header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border:1px solid var(--rule);border-radius:99px;font-size:12px;color:var(--dim);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--dim)}.chip.ok i{background:var(--ok)}.chip.bad i{background:var(--rec)}.chip.warn i{background:var(--amber)}
.chip.ok{color:var(--text)}.chip.bad{color:var(--rec)}
.sp{flex:1}
nav{display:flex;gap:2px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--rule);overflow-x:auto}
nav button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 14px;color:var(--dim)}
nav button[aria-selected=true]{color:var(--text);border-bottom-color:var(--trace)}
nav .badge{margin-left:6px;background:var(--panel2);border:1px solid var(--rule);border-radius:99px;padding:0 7px;font-size:11px}
#bar{height:3px;background:transparent}#bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .3s}
#banner{display:none;margin:12px 16px 0;padding:9px 12px;border:1px solid var(--rule);border-left:3px solid var(--amber);border-radius:var(--r);background:var(--panel)}
#banner.bad{border-left-color:var(--rec)}
main{padding:14px 16px 40px;max-width:1280px;margin:0 auto}
section{display:none}section.on{display:block}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.read{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;margin-bottom:10px}
.big{font-size:44px;line-height:1;font-weight:600;letter-spacing:-.03em}
.big small{font-size:16px;font-weight:500;color:var(--dim);margin-left:4px;letter-spacing:0}
.stat{display:flex;flex-direction:column;gap:1px;font-size:12px;color:var(--dim)}.stat b{font-size:15px;color:var(--text);font-weight:600}
.scope{position:relative}.scope canvas{display:block;width:100%;background:var(--panel);border:1px solid var(--rule);border-radius:var(--r)}
#lc{height:min(52vh,460px);min-height:260px}
.tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--rule);border-radius:var(--r);padding:4px 8px;font-size:12px;display:none;white-space:nowrap;z-index:3}
.ctl{margin-top:10px}
.ctl .grp{display:flex;gap:6px;align-items:center;padding-right:10px;margin-right:2px;border-right:1px solid var(--rule)}.ctl .grp:last-child{border:0}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim)}label.f input{color:var(--text);width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.form fieldset{margin:0;padding:12px 14px 14px;border:1px solid var(--rule);border-radius:var(--r);background:var(--panel)}
.form legend{padding:0 6px;color:var(--text);font-weight:600}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary{margin:12px 0;padding:10px 14px}
.prog{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;width:0;background:var(--amber);transition:width .3s}
.runs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.run>summary{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;cursor:pointer;list-style:none}
.run>summary::-webkit-details-marker{display:none}.run>summary b{font-weight:600}
.run[open]>summary{border-bottom:1px solid var(--rule)}.run .body{padding:12px 14px 14px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:2px 14px;font-size:12px;color:var(--dim);margin:6px 0 10px}.kv b{color:var(--text);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin:8px 0}
.pa{position:relative;text-align:left;padding:6px 7px 6px;background:var(--panel2);cursor:pointer}
.pa canvas{display:block;width:100%;height:38px}.pa .t{display:flex;justify-content:space-between;font-size:12px;margin-top:2px}.pa .m{font-size:11px;color:var(--dim)}
.pa[aria-pressed=true]{border-color:var(--trace);box-shadow:0 0 0 1px var(--trace)}
.pa.cand{border-color:var(--ok)}.pa.pick{border-color:var(--amber)}
.pa .add{position:absolute;top:3px;right:3px;padding:0 6px;font-size:12px;line-height:18px;background:var(--bg)}
.pa .add[aria-pressed=true]{background:var(--trace);color:#06121a;border-color:var(--trace)}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.legend button{display:flex;gap:6px;align-items:center;padding:3px 9px;font-size:12px}.legend i{width:10px;height:3px;border-radius:2px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:5px 10px;border-bottom:1px solid var(--rule)}th{color:var(--dim);font-weight:500}
.empty{padding:36px 16px;text-align:center;color:var(--dim)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}.seg button{border:0;border-radius:0;background:none;padding:4px 11px;color:var(--dim)}.seg button[aria-pressed=true]{background:var(--panel2);color:var(--text)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:var(--r);display:none;max-width:90vw;z-index:9}
.embed header .mainsail{display:none}.embed main{padding-top:8px}
@media(max-width:620px){.big{font-size:34px}header{padding:8px 12px}main{padding:10px 12px 30px}.ctl .grp{border:0;padding:0}.fg{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<header>
 <h1>PA Load Cell</h1>
 <span id="cSrc" class="chip"><i></i><span>connecting</span></span>
 <span id="cRate" class="chip num" hidden></span>
 <span id="cState" class="chip" hidden></span>
 <span class="sp"></span>
 <a class="mainsail" href="/" style="color:var(--dim);text-decoration:none">Back to Mainsail</a>
 <button id="themeBtn" class="quiet" title="Switch light / dark">Theme</button>
</header>
<div id="bar"><i></i></div>
<nav role="tablist" id="tabs">
 <button role="tab" data-tab="live" aria-selected="true">Live</button>
 <button role="tab" data-tab="test" aria-selected="false">PA test</button>
 <button role="tab" data-tab="hist" aria-selected="false">History</button>
 <button role="tab" data-tab="cmp" aria-selected="false">Compare<span class="badge num" id="nCmp">0</span></button>
</nav>
<div id="banner"></div>
<main>
<section id="live" class="on">
 <div class="read">
  <div class="big num" id="now">--<small id="unit"></small></div>
  <div class="stat"><span>min</span><b class="num" id="sMin">-</b></div>
  <div class="stat"><span>max</span><b class="num" id="sMax">-</b></div>
  <div class="stat"><span>mean</span><b class="num" id="sMean">-</b></div>
  <div class="stat"><span>noise (std dev)</span><b class="num" id="sStd">-</b></div>
 </div>
 <div class="scope"><canvas id="lc" aria-label="Live load cell force"></canvas><div class="tip" id="lcTip"></div></div>
 <div class="row ctl card" style="padding:10px 12px">
  <div class="grp">
   <select id="win" aria-label="Time window"><option value="5">5 s</option><option value="10">10 s</option><option value="30" selected>30 s</option><option value="60">1 min</option><option value="120">2 min</option></select>
   <button id="pause">Pause view</button>
   <button id="ylock" aria-pressed="false">Lock scale</button>
  </div>
  <div class="grp">
   <input id="label" placeholder="Label, e.g. PLA grey" size="18" aria-label="Recording label">
   <button id="rec" class="primary">Record</button>
   <button id="mark" hidden>Mark</button>
   <input id="markText" placeholder="Mark note" size="10" hidden aria-label="Mark note">
  </div>
  <div class="grp"><button id="tare" title="Set the current force as zero">Tare</button></div>
 </div>
</section>

<section id="test">
 <p style="color:var(--dim);margin:0 0 12px;max-width:70ch">Extrudes into air at a spot you choose, slow then fast, once for every pressure advance value. Each value is recorded as its own segment. Preheat, home all axes and move Z to 20 mm first.</p>
 <form id="form" class="form" autocomplete="off"></form>
 <div class="card summary"><div id="sum" class="num"></div>
  <div class="prog" id="tprog" hidden><i></i></div><div id="tstat" class="num" style="margin-top:6px;color:var(--dim)"></div></div>
 <div class="row"><button id="tstart" class="primary">Start test</button><button id="tcancel" class="danger" hidden>Cancel test</button><button id="treset" class="quiet">Reset to defaults</button></div>
</section>

<section id="hist">
 <div class="row"><div class="seg" id="kind"><button data-k="all" aria-pressed="true">All</button><button data-k="test" aria-pressed="false">Tests</button><button data-k="manual" aria-pressed="false">Recordings</button></div>
  <input id="search" type="search" placeholder="Search name, filament, notes" size="26" aria-label="Search runs"><span class="sp"></span><button id="refresh" class="quiet">Refresh</button></div>
 <div class="runs" id="runs"></div>
 <div id="viewer" class="card" style="margin-top:14px;padding:12px 14px" hidden>
  <div class="row" style="margin-bottom:8px"><b id="vtitle"></b><span class="sp"></span>
   <div class="seg" id="vmode"><button data-m="trace" aria-pressed="true">Full trace</button><button data-m="edges" aria-pressed="false">Edges</button></div>
   <div class="seg" id="vedge"><button data-e="rise" aria-pressed="true">Rising</button><button data-e="fall" aria-pressed="false">Falling</button></div>
   <button id="vcsv" class="quiet">Export CSV</button></div>
  <div class="scope"><canvas id="hc" style="height:300px"></canvas><div class="tip" id="hcTip"></div></div>
  <div id="vinfo" class="num" style="color:var(--dim);margin-top:6px;font-size:13px"></div>
 </div>
</section>

<section id="cmp">
 <div class="row"><div class="seg" id="cmode"><button data-m="edge" aria-pressed="true">Edge response</button><button data-m="raw" aria-pressed="false">Raw trace</button></div>
  <div class="seg" id="cedge"><button data-e="rise" aria-pressed="true">Rising</button><button data-e="fall" aria-pressed="false">Falling</button></div>
  <select id="calign" hidden aria-label="Align"><option value="start">Align at segment start</option><option value="fast">Align at first fast phase</option></select>
  <span class="sp"></span><button id="cclear" class="quiet">Clear</button></div>
 <div class="legend" id="legend"></div>
 <div class="scope"><canvas id="cc" style="height:340px"></canvas><div class="tip" id="ccTip"></div></div>
 <div id="ctable" style="margin-top:12px"></div>
</section>
</main>
<div id="toast" role="status"></div>

<script>
'use strict';
const $=s=>document.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('palc.'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('palc.'+k,JSON.stringify(v))}catch{}}};
const Q=new URLSearchParams(location.search);
if(Q.get('embed')==='1')document.body.classList.add('embed');
const PAL=['#5ec8ff','#ffb44d','#6fd49a','#c792ea','#ff7b9c','#4dd0c4','#e6d36a','#9aa7b8'];
function toast(m,ms=4200){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',ms)}
const fmt=(v,d=1)=>v==null||!isFinite(v)?'-':(Math.abs(v)>=1000?v.toFixed(0):v.toFixed(d));

/* theme */
function theme(t){document.documentElement.dataset.theme=t;store.set('theme',t);if(window.hchart)redrawAll()}
theme(Q.get('theme')||store.get('theme','dark'));
$('#themeBtn').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* ---- Moonraker JSON-RPC over websocket with auto-reconnect ---- */
const rpc={id:1,pend:new Map(),ws:null,back:500,up:false,
 connect(){const ws=this.ws=new WebSocket(Q.get('ws')?'ws://'+Q.get('ws'):(location.protocol==='https:'?'wss://':'ws://')+location.host+'/websocket');
  ws.onopen=()=>{this.up=true;this.back=500;status()};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}const p=this.pend.get(m.id);if(!p)return;this.pend.delete(m.id);clearTimeout(p.to);
   m.error?p.rej(new Error(m.error.message||'Request failed')):p.res(m.result)};
  ws.onclose=()=>{this.up=false;status();for(const[,p]of this.pend){clearTimeout(p.to);p.rej(new Error('disconnected'))}this.pend.clear();setTimeout(()=>this.connect(),this.back);this.back=Math.min(this.back*2,8000)};
  ws.onerror=()=>ws.close()},
 call(method,params={},ms=8000){return new Promise((res,rej)=>{if(!this.up)return rej(new Error('offline'));const id=this.id++;
  const to=ms?setTimeout(()=>{this.pend.delete(id);rej(new Error('timeout'))},ms):0;
  this.pend.set(id,{res,rej,to});this.ws.send(JSON.stringify({jsonrpc:'2.0',method,params,id}))})}};
const api=(n,p,ms)=>rpc.call('printer.pa_loadcell.'+n,p,ms);
const gcode=(script,ms=0)=>rpc.call('printer.gcode.script',{script},ms);

/* ---- chart ---- */
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function nice(range,n){const r=range/n,p=Math.pow(10,Math.floor(Math.log10(r||1))),f=r/p;return(f<1.5?1:f<3?2:f<7?5:10)*p}
function at(s,t){const a=s.t;if(!a.length||t<a[0]||t>a[a.length-1])return null;let lo=0,hi=a.length-1;while(hi-lo>1){const m=(lo+hi)>>1;a[m]<=t?lo=m:hi=m}return s.f[Math.abs(a[lo]-t)<=Math.abs(a[hi]-t)?lo:hi]}
class Chart{
 constructor(cv,tip,mini){this.cv=cv;this.tip=tip;this.mini=!!mini;this.cfg={series:[]};this.hx=null;this.g=null;
  if(tip){cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();this.hx=e.clientX-r.left;this.hy=e.clientY-r.top;this.render()});
   cv.addEventListener('mouseleave',()=>{this.hx=null;this.render()})}}
 set(c){this.cfg=c;this.render()}
 render(){const cv=this.cv,w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;const dpr=devicePixelRatio||1;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
  const C=this.cfg,S=C.series||[],mini=this.mini,L=mini?2:50,R=mini?2:14,T=mini?3:10,B=mini?3:22,pw=w-L-R,ph=h-T-B;
  let x0=C.x0,x1=C.x1;if(x0===undefined){x0=1e18;x1=-1e18;for(const s of S)if(s.t.length){x0=Math.min(x0,s.t[0]);x1=Math.max(x1,s.t[s.t.length-1])}}
  const dim=css('--dim'),grid=css('--grid');c.font='11px '+css('--font');
  if(!(x1>x0)){if(!mini){c.fillStyle=dim;c.textAlign='center';c.fillText(C.empty||'No data yet',w/2,h/2)}this.g=null;if(this.tip)this.tip.style.display='none';return}
  const cols=S.map(s=>{const mn=new Float32Array(pw).fill(Infinity),mx=new Float32Array(pw).fill(-Infinity),sc=(pw-1)/(x1-x0);
   for(let i=0;i<s.t.length;i++){const k=Math.round((s.t[i]-x0)*sc);if(k<0||k>=pw)continue;const v=s.f[i];if(v<mn[k])mn[k]=v;if(v>mx[k])mx[k]=v}return{mn,mx}});
  let y0=C.y0,y1=C.y1;if(y0===undefined){y0=1e18;y1=-1e18;for(const k of cols)for(let i=0;i<pw;i++){if(k.mn[i]<y0)y0=k.mn[i];if(k.mx[i]>y1)y1=k.mx[i]}
   if(!(y1>y0)){y0=(isFinite(y0)?y0:0)-1;y1=y0+2}const pad=(y1-y0)*.08;y0-=pad;y1+=pad}
  const X=t=>L+(t-x0)/(x1-x0)*pw,Y=v=>T+ph-(v-y0)/(y1-y0)*ph;this.g={L,R,T,B,pw,ph,x0,x1,y0,y1,X,Y,w,h};
  for(const b of C.bands||[]){const a=Math.max(X(b.t0),L),z=Math.min(X(b.t1),L+pw);if(z>a){c.fillStyle=b.color;c.fillRect(a,T,z-a,ph)}}
  if(!mini){c.strokeStyle=grid;c.lineWidth=1;c.fillStyle=dim;c.textAlign='left';const sy=nice(y1-y0,5);
   for(let v=Math.ceil(y0/sy)*sy;v<y1;v+=sy){const y=Math.round(Y(v))+.5;c.beginPath();c.moveTo(L,y);c.lineTo(L+pw,y);c.stroke();c.fillText(+v.toPrecision(4),4,y+4)}
   const sx=nice(x1-x0,7);for(let t=Math.ceil(x0/sx)*sx;t<x1;t+=sx){const x=Math.round(X(t))+.5;c.beginPath();c.moveTo(x,T);c.lineTo(x,T+ph);c.stroke();c.fillText(+t.toFixed(3)+(C.xunit||'s'),x-12,h-6)}
   if(y0<0&&y1>0){c.strokeStyle=dim;c.globalAlpha=.5;const y=Math.round(Y(0))+.5;c.beginPath();c.moveTo(L,y);c.lineTo(L+pw,y);c.stroke();c.globalAlpha=1}}
  for(const v of C.vlines||[]){const x=Math.round(X(v.t))+.5;if(x<L||x>L+pw)continue;c.strokeStyle=v.color||css('--amber');c.setLineDash([4,3]);c.beginPath();c.moveTo(x,T);c.lineTo(x,T+ph);c.stroke();c.setLineDash([]);
   if(v.label&&!mini){c.fillStyle=v.color||css('--amber');c.textAlign='left';c.fillText(v.label,x+4,T+11)}}
  S.forEach((s,j)=>{const k=cols[j];c.strokeStyle=s.color;c.globalAlpha=s.alpha??1;c.lineWidth=s.w||(mini?1.2:1.5);c.lineJoin='round';c.beginPath();let on=false;
   if(s.t.length<pw){for(let i=0;i<s.t.length;i++){const x=X(s.t[i]),y=Y(s.f[i]);i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();c.globalAlpha=1;return}
   for(let i=0;i<pw;i++){if(k.mn[i]===Infinity){on=false;continue}const x=L+i+.5,a=Y(k.mn[i]),b=Y(k.mx[i]);
    if(!on){c.moveTo(x,a);on=true}else c.lineTo(x,a);if(b!==a)c.lineTo(x,b)}c.stroke();c.globalAlpha=1});
  if(C.now!=null&&!mini){const x=L+pw,y=Y(C.now);c.fillStyle=S[0].color;c.beginPath();c.arc(x-1,y,3.5,0,7);c.fill();
   const txt=C.nowText,tw=c.measureText(txt).width+10,ty=Math.max(T,Math.min(T+ph-16,y-8));c.fillRect(L+pw-tw-8,ty,tw,16);c.fillStyle=css('--bg');c.textAlign='left';c.fillText(txt,L+pw-tw-3,ty+12)}
  if(this.tip&&this.hx!=null&&this.hx>=L&&this.hx<=L+pw){const t=x0+(this.hx-L)/pw*(x1-x0);const x=Math.round(this.hx)+.5;c.strokeStyle=dim;c.lineWidth=1;c.beginPath();c.moveTo(x,T);c.lineTo(x,T+ph);c.stroke();
