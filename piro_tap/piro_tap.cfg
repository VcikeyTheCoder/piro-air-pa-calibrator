# PIRO-TAP: BTT Eddy nozzle-contact Z probe (Hz based).
# Installed by install.sh (probe or both) and included from printer.cfg.
# Wiki: https://github.com/VcikeyTheCoder/piro-air-pa-calibrator/wiki/PIRO-TAP-probe
#
# Before you uncomment [piro_tap]:
#   * remove (or comment out) every other probe: [probe], [load_cell_probe],
#     [probe_eddy_current], [bltouch] ... Klipper allows one probe
#   * remove [pa_eddy] if it uses this Eddy (one Eddy, one section); with the
#     PA calibrator set  eddy: piro_tap  in [pa_loadcell]
#   * in [stepper_z]:
#       endstop_pin: probe:z_virtual_endstop
#       position_min: -2
#       homing_speed: 5            # first two homing touches (mm/s)
#       second_homing_speed: 2     # last two homing touches, Z = their average
#       homing_retract_dist: 5
#
# First run (nozzle clean, about 5 mm above the bed):
#   LDC_CALIBRATE_DRIVE_CURRENT CHIP=piro_tap
#   PIRO_TAP_CALIBRATE MODE=THRESHOLD      trigger_hz = 3 x noise (peak to peak)
#   SAVE_CONFIG
#   PROBE_ACCURACY SAMPLES=10
# Thermal expansion (optional):
#   PIRO_TAP_THERMAL_CALIBRATE START=0 END=200 STEP=50     then SAVE_CONFIG
#   in PRINT_START, after G28 (and the mesh), before the first layer:
#   PIRO_TAP_THERMAL_APPLY TEMP={first layer nozzle temperature}

# trigger_hz, pressure_sign, drift_filter_hz, thermal_coeff and
# reg_drive_current are written by
# SAVE_CONFIG at the bottom of printer.cfg: leave them commented here
# (Klipper refuses SAVE_CONFIG for values set in an included file).

#[piro_tap]
#i2c_mcu: EBB                  # the board the Eddy is wired to
#i2c_bus: i2c3_PB3_PB4         # its I2C bus
#reg_drive_current: 15         # LDC_CALIBRATE_DRIVE_CURRENT CHIP=piro_tap finds it
#
## contact (all in Hz from the tare taken before every touch)
#trigger_hz:                   # set by PIRO_TAP_CALIBRATE MODE=THRESHOLD
#force_limit_hz: 2000          # the probing move stops with an error past this
#pressure_sign: auto           # up / down: which way pressure moves the frequency
#lowpass_hz: 25                # noise filter on the EBB before the trigger
#lowpass_order: 2
#drift_filter_hz: 0            # set by MODE=DRIFT if the reading wanders
#tare_time: 0.1                # s of samples for each tare
#
## pullback (Z comes from it)
#pullback_distance: 0.2        # mm, fixed
#pullback_samples_per_um: 4    # slow lift: 4 samples per micron (0.1 mm/s at 400/s)
#pullback_speed: 0             # mm/s, overrides the line above when not 0
#dwell_time: 0.1               # s pressed before the pullback
#
## probing
#speed: 3                      # mm/s down (PROBE, mesh, Z tilt)
#lift_speed: 10
#samples: 1
#sample_retract_dist: 2
#z_offset: 0                   # nozzle probe: 0
#tap_retries: 2                # poor touches (ooze) are repeated
#min_quality: 40               # % below which a touch is repeated
#retry_lift: 1
#home_tolerance: 0.01          # mm: the two slow homing touches must agree
#max_probe_temp: 0             # degC, refuse to probe hotter (0 = no limit)
#
## Eddy sample rate per job (samples/s)
#probe_rate: 400
#pa_rate: 400
#idle_rate: 100
#
## thermal expansion
#thermal_coeff: 0              # mm per degC, set by PIRO_TAP_THERMAL_CALIBRATE
#
#data_dir: ~/printer_data/piro_tap
