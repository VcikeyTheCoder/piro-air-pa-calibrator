# PIRO-LC: Z homing, paper offset and nozzle growth for Klipper's own
# [load_cell_probe]. Klipper's probing is used as it is (tare, MCU trigger,
# pullback fit); PIRO-LC only sets how G28 Z touches, where Z=0 is, and the
# nozzle growth.
#
# This file is yours: install.sh never overwrites it.
#
# ---------------------------------------------------------------------------
# Setup (in your own config files)
# ---------------------------------------------------------------------------
# [stepper_z]
# endstop_pin: probe:z_virtual_endstop   # G28 Z homes with the load cell
# homing_retract_dist: 2                 # > 0, or touch 2 never runs
# # remove position_endstop (the probe gives it)
#
# [load_cell_probe]
# z_offset: 0                            # the paper test sets the offset
# # all optional, these are the defaults:
# #homing_first_speed: 10                # mm/s, touch 1
# #homing_second_speed: 2                # mm/s, touch 2
# #homing_first_samples: 2               # taps for touch 1
# #homing_second_samples: 2              # taps for touch 2
# #homing_samples_tolerance: 0.01        # mm, taps of one touch must agree
# #homing_samples_retries: 5
# #paper_thickness: 0.08                 # mm, start value
# #max_paper_offset: 1.0                 # mm, a larger paper offset is refused
# #max_growth_offset: 0.3                # mm, a larger growth offset is refused
# # written by the calibrations into the SAVE_CONFIG block of printer.cfg.
# # Don't set these two in [load_cell_probe] when it is in an included file
# # (SAVE_CONFIG refuses options that are also in an included file):
# #paper_offset: 0
# #nozzle_growth: 0                      # mm per degree C
#
# Every tap is Klipper's own: tare, descend until the trigger force, then
# the pullback fit. Touch 1 and touch 2 each take their samples, which must
# agree within the tolerance; the median sets Z. Z is marked homed and the
# homing events are sent by Klipper itself, so homing_override, z_tilt,
# bed_mesh, KAMP and every other module see a normal homing.
#
# ---------------------------------------------------------------------------
# Calibration (once, and after a nozzle change)
# ---------------------------------------------------------------------------
#   PIRO_LC_CALIBRATE                 home Z, then the paper test
#   PIRO_LC_CALIBRATE GROWTH=1 START=0 END=250 STEP=50
#                                     home Z, paper test, then nozzle growth
#   SAVE_CONFIG
# Paper test: lower with TESTZ until the paper (default 0.08 mm, change with
# PIRO_LC_PAPER_THICKNESS VALUE=0.1, also during the test) just drags, then
# ACCEPT. Mainsail and Fluidd show their Z adjust dialog for it.
#
# ---------------------------------------------------------------------------
# PRINT_START order
# ---------------------------------------------------------------------------
#   G28                               saves the nozzle temperature of the homing
#   Z_TILT_ADJUST
#   G28 Z                             (saves it again: the latest one counts)
#   BED_MESH_CALIBRATE ADAPTIVE=1
#   NOZZLE_GROWTH_APPLY TEMP={target_extruder}
#   M109 S{target_extruder}           heat to print temperature
#   purge and print
# The growth offset is set before heating, so it predicts the growth from
# the last Z homing temperature to the first layer temperature. A new Z
# homing clears it; apply again after re-homing.
#
# ---------------------------------------------------------------------------
# homing_override: home Z with a plain G28 Z inside it
# ---------------------------------------------------------------------------
# [homing_override]
# axes: xyz
# gcode:
#     {% set hx = 'X' in params %}{% set hy = 'Y' in params %}{% set hz = 'Z' in params %}
#     {% set all = not (hx or hy or hz) %}
#     {% if all or hx %}G28 X{% endif %}
#     {% if all or hy %}G28 Y{% endif %}
#     {% if all or hz %}
#         G90
#         G1 X165 Y165 F6000          # homing XY
#         G28 Z                       # Klipper's own homing with the load cell
#         G1 Z10 F600
#     {% endif %}


[piro_lc]
#data_dir: ~/printer_data/prio_edge/loadcell (default)


[gcode_macro NOZZLE_GROWTH_APPLY]
description: Correct Z for nozzle growth from the last Z homing to TEMP (PIRO-LC)
gcode:
    {% set temp = params.TEMP|default(0)|float %}
    {% if temp > 0 %}
        PIRO_LC_GROWTH_APPLY TEMP={temp}
    {% else %}
        {action_respond_info("NOZZLE_GROWTH_APPLY needs TEMP=<first layer temperature>: no growth correction")}
    {% endif %}
