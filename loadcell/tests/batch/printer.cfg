# Batch test printer for PIRO-LC (linux MCU dictionary). Not a real printer.
[mcu]
serial: /tmp/klipper_host_mcu
[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 300
[stepper_x]
step_pin: gpio0
dir_pin: gpio1
enable_pin: !gpio2
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio3
position_endstop: 0
position_max: 300
homing_speed: 50
[stepper_y]
step_pin: gpio4
dir_pin: gpio5
enable_pin: !gpio6
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio7
position_endstop: 0
position_max: 300
homing_speed: 50
[stepper_z]
step_pin: gpio8
dir_pin: gpio9
enable_pin: !gpio10
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -10
position_max: 290
homing_speed: 10
second_homing_speed: 2
homing_retract_dist: 2
[load_cell_probe]
homing_first_speed: 10
homing_second_speed: 2
sensor_type: hx717
dout_pin: gpio20
sclk_pin: gpio21
sample_rate: 320
trigger_force: 75
force_safety_limit: 2000
z_offset: 0
speed: 3.0
lift_speed: 2.0
samples: 2
samples_result: median
samples_tolerance: 0.0085
samples_tolerance_retries: 30
counts_per_gram: 95.783
reference_tare_counts: 345400
drift_filter_cutoff_frequency: 0.5
[force_move]
enable_force_move: True
[heater_bed]
heater_pin: gpio30
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog1
control: watermark
min_temp: 0
max_temp: 130
[extruder]
step_pin: gpio11
dir_pin: gpio12
enable_pin: !gpio13
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio31
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog2
control: watermark
min_temp: 0
max_temp: 300
[bed_mesh]
mesh_min: 20,20
mesh_max: 180,180
probe_count: 3,3
# [piro_lc] and NOZZLE_GROWTH_APPLY come from ../../piro_lc.cfg (added by the test)
[homing_override]
axes: xyz
gcode:
    {% set hx = 'X' in params %}{% set hy = 'Y' in params %}{% set hz = 'Z' in params %}
    {% set all = not (hx or hy or hz) %}
    {% if all or hx %}G28 X{% endif %}
    {% if all or hy %}G28 Y{% endif %}
    {% if all or hz %}
      G1 X150 Y150 F6000
      G28 Z
      G1 Z10 F600
    {% endif %}
