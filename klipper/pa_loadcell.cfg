# One place for all defaults. Every value (except the safety limits and
# storage options at the bottom) can be overridden per run, e.g.
#   PA_LOADCELL_TEST PA_START=0 PA_END=0.06 CYCLES=3 TEST_X=150 TEST_Y=20
#
# The test needs a larger extrusion limit in [extruder], because every
# pulse extrudes its filament while the nozzle moves only WOBBLE mm:
#   [extruder]
#   max_extrude_cross_section: 100
# (the PA test tab shows the exact value your settings need)
[pa_loadcell]
load_cell: load_cell_probe  # your [load_cell] or [load_cell_probe] section name; the other one is tried automatically
# -- test defaults (pulse shape matches KAPAT) --
pa_start: 0.0
pa_end: 0.08
pa_step: 0.005
cycles: 4                   # fast + slow pulses per PA value (the first is skipped in analysis)
fast_flow: 19.24            # mm3/s during the fast leg
fast_time: 0.25             # s per fast leg
slow_flow: 1.92             # mm3/s during the slow leg
slow_time: 1.0              # s per slow leg
prime_length: 40            # mm of filament pushed before the first PA value
prime_flow: 5               # mm3/s during the prime (extrude-only)
wobble: 0.05                # mm of XY travel per leg so Klipper applies PA (0 = off)
wobble_axis: Y              # X or Y
accel: 1000                 # mm/s2 for the toolhead (XY) during the test; extruder limits untouched
max_filament: 400           # mm, a test that would use more is refused
model: fall_undershoot      # analysis model: rise_fast, fall_slow or fall_undershoot
skip_first_pulse: 1         # 1 = ignore the first pulse of every PA value
park_x: 10                  # REQUIRED: rest position
park_y: 10
test_x: 150                 # REQUIRED: where the nozzle extrudes in air
test_y: 10
filament:                   # name stored in run metadata
# -- safety limits (config only) --
min_temp: 200
required_z: 20              # Z height the test must start at
z_tolerance: 0.5
sample_timeout: 3           # s without load cell data before aborting
# -- storage / live view (config only) --
data_dir: ~/printer_data/pa_loadcell
ring_size: 60000            # live buffer, samples (~3 min at 320 Hz)
live_idle: 15               # stop streaming this long after the last viewer
max_record_seconds: 300     # auto-stop for manual recordings
