# One place for all defaults. Every value (except the safety limits and
# storage options at the bottom) can be overridden per run, e.g.
#   PA_LOADCELL_TEST FAST_FLOW=10 PA_MAX=0.08 TEST_X=150 TEST_Y=20
#
# PIRO-EDGE: extrude-only pulses with artificial pressure advance (no XY
# motion, no max_extrude_cross_section change), and an adaptive search:
# PA 0, then PA_MAX (+UPPER_STEP until the force dips after a slow-down,
# fail at PA_LIMIT), then values around the predicted answer.
[pa_loadcell]
load_cell: load_cell_probe  # your [load_cell] or [load_cell_probe] section name; the other one is tried automatically
# -- search --
pa_max: 0.10                # first high PA tried; must show a dip
upper_step: 0.02            # added to PA_MAX while it shows no dip
pa_limit: 0.20              # no dip up to here = the test fails
# -- pulses (timing from OznLab sensor) --
cycles: 6                   # fast + slow pulses per PA value (the first is skipped)
fast_flow: 12               # mm3/s during the fast leg
fast_time: 0.6              # s per fast leg
slow_flow: 1.8              # mm3/s during the slow leg
slow_time: 1.0              # s per slow leg
prime_length: 20            # mm of filament pushed before the first PA value
prime_flow: 12              # mm3/s during the prime
prime_rest: 1               # s pause after the prime
rest_time: 0.3              # s pause before every PA value
max_filament: 400           # mm, a test that could use more is refused
skip_first_pulse: 1         # 1 = ignore the first pulse of every PA value
park_x: 10                  # REQUIRED: rest position
park_y: 10
test_x: 150                 # REQUIRED: where the nozzle extrudes in air
test_y: 10
filament:                   # name stored in run metadata
# -- safety limits (config only) --
min_temp: 200
required_z: 20              # Z height the test must start at
z_tolerance: 0.5
sample_timeout: 3           # s without load cell data before aborting
# -- storage / live view (config only) --
data_dir: ~/printer_data/pa_loadcell
ring_size: 60000            # live buffer, samples (~3 min at 320 Hz)
live_idle: 15               # stop streaming this long after the last viewer
max_record_seconds: 300     # auto-stop for manual recordings
