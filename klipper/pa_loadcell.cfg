# PIRO-EDGE pressure advance calibration.
# Values above the safety section can be overridden per run, e.g.
#   PA_LOADCELL_TEST FAST_FLOW=10 PA_MAX=0.08 TEST_X=150 TEST_Y=20
# Values above the safety section can also be edited in Settings on the
# Load Cell page.
[pa_loadcell]
load_cell: load_cell_probe  # [load_cell] or [load_cell_probe] section name
# -- search --
pa_max: 0.10                # first upper PA value
upper_step: 0.02            # added to pa_max until the force dips
pa_limit: 0.20              # test fails if no dip up to this value
# -- pulses --
cycles: 6                   # fast + slow pulses per PA value
fast_flow: 12               # mm3/s, fast leg
fast_time: 0.6              # s, fast leg
slow_flow: 1.8              # mm3/s, slow leg
slow_time: 1.0              # s, slow leg
prime_length: 20            # mm before the first PA value, 0 disables
prime_flow: 12              # mm3/s, prime
prime_rest: 1               # s, pause after prime
rest_time: 0.3              # s, pause before each PA value
max_filament: 400           # mm, limit per test
skip_first_pulse: 1         # 1 = ignore the first pulse of each PA value
park_x: 10                  # required, park position
park_y: 10
test_x: 150                 # required, extrusion position
test_y: 10
filament:                   # stored with each run
# -- method --
pa_method: push             # push = test adds PA (no motion), klipper = Klipper's PA on a short line
move_axis: Y                # klipper method: line axis (X or Y)
test_accel: 5000            # klipper method: toolhead accel, mm/s2 (capped at max_accel)
smooth_time: 0              # 0 = extruder's pressure_advance_smooth_time, or 0.01 to 0.1 for this test
# -- auto PA (PA_AUTO in pa_auto.cfg passes its own values) --
fail_pa: 0.02               # APPLY=1: set on a poor result, an error or a cancel
reuse_hours: 0              # APPLY=1: reuse a matching recent auto result, 0 = always test
# -- safety (read only in Settings) --
min_temp: 200               # degC, minimum extruder temperature
required_z: 20              # mm, Z height at test start
z_tolerance: 0.5
sample_timeout: 3           # s without load cell data before abort
# -- storage and live view --
data_dir: ~/printer_data/pa_loadcell
ring_size: 60000            # live buffer, samples (~3 min at 320 Hz)
live_idle: 15               # s, streaming stops after the last viewer
max_record_seconds: 300     # s, manual recording limit
#config_path:
#   File Settings saves to. Default: pa_loadcell.cfg next to printer.cfg.
