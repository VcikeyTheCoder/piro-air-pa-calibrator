# PIRO-EDGE auto pressure advance before every print.
#
# PRINT_START calls it once, after the bed mesh:
#     PA_AUTO {rawparams}
# and passes on what the slicer sent to print_start. OrcaSlicer, Machine
# start G-code (one line):
#     print_start EXTRUDER=[first_layer_temperature] BED=[first_layer_bed_temperature] CHAMBER=[chamber_temperature] PRINT_TEMP={nozzle_temperature[initial_extruder]} PA_ON={if enable_pressure_advance[initial_extruder]}1{else}0{endif} WALL_FLOW={outer_wall_volumetric_speed} FILAMENT="{filament_settings_id[initial_extruder]}" OUTER_ACCEL={outer_wall_acceleration[initial_extruder]}
#
#   EXTRUDER     first layer nozzle temperature
#   PRINT_TEMP   nozzle temperature of the other layers (the walls): PA is
#                measured here
#   PA_ON        1 = pressure advance is on in the filament profile: Orca sets
#                its own value and no test runs
#   WALL_FLOW    outer wall flow in mm3/s (Orca: outer wall speed x line width
#                x layer height, capped at the filament's max volumetric speed)
#   FILAMENT     filament profile name, stored with the run and used for reuse
#   OUTER_ACCEL  outer wall acceleration, used by the klipper method
#
# Four macros, each usable on its own:
#   PA_AUTO           the one PRINT_START calls: runs the three below in order
#                     and handles the temperatures
#   PA_AUTO_POSITION  moves to the PA location
#   PA_AUTO_RUN       runs the test at WALL_FLOW and sets the result
#   PA_AUTO_FLICK     retract, flick, and (push: 1) push the purge off the bed
#
# No usable result, an error or a cancel sets fail_pa; the print always goes
# on. This file is yours: install.sh never overwrites it.


[gcode_macro PA_AUTO]
description: Pressure advance at the outer wall flow before a print (PIRO-EDGE)
variable_settle_time: 10        # s at print temperature before the test
gcode:
    {% set first_temp = params.EXTRUDER|default(0)|float %}
    {% set print_temp = params.PRINT_TEMP|default(first_temp)|float %}
    {% set pa_on = params.PA_ON|default(1)|int %}

    SAVE_GCODE_STATE NAME=PA_AUTO_STATE
    PA_AUTO_POSITION

    {% if print_temp > 0 %}
        SET_DISPLAY_TEXT MSG="PA: heating to {print_temp|int}c"
        M109 S{print_temp}
        G4 P{(settle_time * 1000)|int}
    {% endif %}

    {% if pa_on == 0 %}
        PA_AUTO_RUN {rawparams}
    {% else %}
        {action_respond_info("PA_AUTO: pressure advance is on in the filament profile, the slicer sets it")}
    {% endif %}

    {% if first_temp > 0 and first_temp != print_temp %}
        SET_DISPLAY_TEXT MSG="PA: nozzle to {first_temp|int}c"
        M109 S{first_temp}
    {% endif %}

    PA_AUTO_FLICK
    RESTORE_GCODE_STATE NAME=PA_AUTO_STATE


[gcode_macro PA_AUTO_POSITION]
description: Move to the PA location (PIRO-EDGE auto PA)
variable_pos_x: -1              # mm, -1 = X max from the axis limits
variable_pos_y: 220             # mm
variable_pos_z: 15              # mm
variable_travel_speed: 200      # mm/s
gcode:
    {% set th = printer.toolhead %}
    {% set px = th.axis_maximum.x if pos_x < 0 else pos_x %}
    {% set z_now = printer.gcode_move.gcode_position.z %}
    {% set f = travel_speed * 60 %}
    SAVE_GCODE_STATE NAME=PA_POSITION_STATE
    G90
    {% if z_now < pos_z %}
        G1 Z{pos_z} F{f}
        G1 X{px} Y{pos_y} F{f}
    {% else %}
        G1 X{px} Y{pos_y} F{f}
        G1 Z{pos_z} F{f}
    {% endif %}
    RESTORE_GCODE_STATE NAME=PA_POSITION_STATE


[gcode_macro PA_AUTO_RUN]
description: Measure PA at WALL_FLOW and set it (PIRO-EDGE auto PA)
# -- test --
variable_method: "push"         # push = nozzle stays still, Klipper PA at 0
                                # klipper = Klipper's own PA on a back-and-forth line
variable_reuse_hours: 1         # reuse a matching result this recent, 0 = always test
variable_fail_pa: 0.02          # set on a poor result, an error or a cancel
# -- klipper method: the line starts at the PA location --
variable_line_axis: "Y"         # X or Y
variable_line_dir: 1            # 1 = towards +, -1 = towards -
variable_line_length: 30        # mm
variable_use_slicer_accel: 1    # 1 = OUTER_ACCEL from the slicer, 0 = test_accel in pa_loadcell.cfg
gcode:
    {% set wall_flow = params.WALL_FLOW|default(0)|float %}
    {% set filament = params.FILAMENT|default("")|replace('"', '')|trim %}
    {% set accel = params.OUTER_ACCEL|default(0)|float %}
    {% if wall_flow <= 0 %}
        {action_respond_info("PA_AUTO_RUN: no WALL_FLOW, PA %.4f set"|format(fail_pa))}
        SET_PRESSURE_ADVANCE ADVANCE={fail_pa}
    {% else %}
        SET_DISPLAY_TEXT MSG="PA: measuring at {"%.1f"|format(wall_flow)} mm3/s"
        {% set common = "RESTRICT=0 APPLY=1 FAST_FLOW=%.3f REUSE_HOURS=%s FAIL_PA=%s"|format(wall_flow, reuse_hours, fail_pa) %}
        {% if method == "klipper" %}
            {% set acc = ("TEST_ACCEL=%.0f"|format(accel)) if (use_slicer_accel and accel > 0) else "" %}
            PA_LOADCELL_TEST {common} PA_METHOD=klipper MOVE_AXIS={line_axis} LINE_DIR={line_dir} LINE_LENGTH={line_length} {acc} FILAMENT="{filament}"
        {% else %}
            PA_LOADCELL_TEST {common} PA_METHOD=push FILAMENT="{filament}"
        {% endif %}
    {% endif %}


[gcode_macro PA_AUTO_FLICK]
description: Retract, flick the ooze off and optionally push the purge away (PIRO-EDGE auto PA)
# -- flick, at X max --
variable_retract: 5             # mm
variable_retract_speed: 30      # mm/s
variable_flick_count: 6         # back-and-forth strokes
variable_flick_near: 3          # mm in from X max
variable_flick_far: 10          # mm in from X max
variable_flick_speed: 350       # mm/s, also used by the push
variable_flick_accel: 10000     # mm/s2, speed and accel are restored after
# -- push the purge off the bed (no purge bucket) --
variable_push: 0                # 1 = on
variable_push_axis: "X"         # X or Y
variable_push_dir: 1            # 1 = push towards +, -1 = towards -
variable_push_back: 20          # mm moved the opposite way first
variable_push_forward: 20       # mm pushed in push_dir
variable_push_z: 5              # mm, nozzle height for the push
gcode:
    {% set th = printer.toolhead %}
    {% set xmax = th.axis_maximum.x %}
    {% set pos = printer.gcode_move.gcode_position %}
    {% set fv = flick_speed * 60 %}
    {% set ax = push_axis|upper %}
    {% set i = 0 if ax == "X" else 1 %}
    {% set lo = th.axis_minimum[i] %}
    {% set hi = th.axis_maximum[i] %}
    {% set start = (xmax - flick_near) if ax == "X" else pos.y %}
    {% set back = [[start - push_dir * push_back, lo]|max, hi]|min %}
    {% set fwd = [[back + push_dir * push_forward, lo]|max, hi]|min %}

    SAVE_GCODE_STATE NAME=PA_FLICK_STATE
    SET_DISPLAY_TEXT MSG="PA: flick"
    M83
    G1 E-{retract} F{retract_speed * 60}
    G90
    SET_VELOCITY_LIMIT VELOCITY={[th.max_velocity, flick_speed]|max} ACCEL={flick_accel}
    G1 X{xmax - flick_near} F{fv}
    {% for n in range(flick_count) %}
        G1 X{xmax - flick_far} F{fv}
        G1 X{xmax - flick_near} F{fv}
    {% endfor %}
    {% if push %}
        SET_DISPLAY_TEXT MSG="PA: push"
        G1 {ax}{back} F{fv}
        G1 Z{push_z} F{fv}
        G1 {ax}{fwd} F{fv}
        G1 Z{pos.z} F{fv}
    {% endif %}
    SET_VELOCITY_LIMIT VELOCITY={th.max_velocity} ACCEL={th.max_accel}
    RESTORE_GCODE_STATE NAME=PA_FLICK_STATE
